<head>

<meta name="theme-color" content="#ffffff">

<style>
  @font-face { font-family: "Hand"; font-weight: 400; src: url(../fonts/hand-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Hand"; font-weight: 400; src: url(../fonts/hand-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(../fonts/plex-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(../fonts/plex-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-2199, U+25A0, U+FEFF; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(../fonts/plex-hebrew-500.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(../fonts/plex-latin-500.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-2199, U+25A0, U+FEFF; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 600; src: url(../fonts/plex-hebrew-600.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 600; src: url(../fonts/plex-latin-600.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-2199, U+25A0, U+FEFF; font-display: swap; }

  :root { --ink: #111; --soft: #8c8c8c; --line: #e3e3e3; --ease: cubic-bezier(.22, 1, .36, 1); --bar: 72px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #fff; }
  body { font-family: "Swiss", system-ui, sans-serif; font-size: 14px; font-weight: 500; color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, a { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-decoration: none; }

  /* top bar */
  header { position: fixed; top: 0; inset-inline: 0; height: var(--bar); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--line); background: #fff; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 18px; white-space: nowrap; }
  .brand svg { width: 28px; height: 28px; }
  .tools { display: flex; gap: 6px; }
  #addLink .plus { display: none; width: 16px; height: 16px; }
  .b { height: 40px; min-width: 40px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #d6d6d6; font-size: 14px; font-weight: 500; transition: border-color .25s, background .25s; white-space: nowrap; }
  .b:hover { border-color: var(--ink); }
  .b.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .b.icon { padding: 0; width: 40px; }
  .b svg { width: 16px; height: 16px; }
  #watch .ic-pause, .playing #watch .ic-play { display: none; }
  .playing #watch .ic-pause { display: block; }

  /* stage */
  /* colour behind the book: soft pools of light that keep drifting */
  .glow { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .glow i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .55; mix-blend-mode: multiply; will-change: transform; }
  .glow .a { background: #FFE27A; left: -15vmax; top: -10vmax; animation: drift1 26s ease-in-out infinite alternate; }
  .glow .b { background: #FFC2B0; right: -20vmax; top: 10vmax; animation: drift2 31s ease-in-out infinite alternate; }
  .glow .c { background: #CFE0FF; left: 20vmax; bottom: -30vmax; animation: drift3 37s ease-in-out infinite alternate; }
  .glow .d { background: #D6F3E3; right: 10vmax; bottom: -20vmax; animation: drift1 29s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(28vmax, 18vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-26vmax, 22vmax) scale(.9); } }
  @keyframes drift3 { to { transform: translate(18vmax, -26vmax) scale(1.2); } }
  .full .glow, .tv .glow { display: none; }
  #book { position: fixed; top: var(--bar); bottom: 48px; inset-inline: 0; opacity: 0; transition: opacity 1.4s var(--ease); z-index: 1; }
  .ready #book { opacity: 1; }
  #book canvas { display: block; touch-action: none; }

  .fullexit { display: none; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; z-index: 8; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; place-items: center; transition: opacity .5s; }
  .nofs.full .fullexit { display: grid; } .nofs.full.quiet .fullexit { opacity: 0; }
  .arrow { position: fixed; top: calc(50% + 14px); transform: translateY(-50%); width: 40px; height: 40px; border: 1px solid #d6d6d6; display: grid; place-items: center; background: rgba(255,255,255,.8); transition: opacity .5s var(--ease), border-color .25s; z-index: 4; }
  .arrow:hover { border-color: var(--ink); }
  .arrow svg { width: 16px; height: 16px; }
  .arrow.l { left: 24px; } .arrow.r { right: 24px; }
  .arrow[disabled] { opacity: 0; pointer-events: none; }

  .b.small { height: 32px; padding: 0 12px; font-size: 13px; }
  [data-state="open"] .open-ed, [data-state="pages"] .open-ed, [data-state="front"] .close-ed, [data-state="back"] .close-ed { display: none; }

  /* status bar */
  footer { position: fixed; bottom: 0; inset-inline: 0; height: 48px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 20px; font-size: 13px; font-weight: 500; color: var(--soft); background: #fff; z-index: 5; }
  footer .ctl { justify-self: end; }
  footer .prog { justify-self: start; }
  .strip { display: flex; gap: 6px; justify-self: center; overflow-x: auto; max-width: 100%; padding: 4px 2px; scrollbar-width: none; direction: rtl; touch-action: pan-x; }
  .strip::-webkit-scrollbar { display: none; }
  .strip .pg { display: flex; gap: 1px; padding: 0; border: 1px solid #e2e2e2; outline: 2px solid transparent; outline-offset: 1px; background: #fff; cursor: pointer; flex: none; opacity: .4; transition: opacity .2s, outline-color .2s; }
  .strip .pg canvas { display: block; }
  .strip .pg:hover { opacity: .85; }
  .strip .pg.on { opacity: 1; border-color: var(--ink); outline-color: var(--ink); }
  .prog { display: flex; align-items: center; gap: 12px; direction: rtl; color: var(--ink); font-variant-numeric: tabular-nums; }
  .prog .track { position: relative; width: min(260px, 32vw); height: 22px; cursor: pointer; touch-action: none; }
  .prog .track::before { content: ""; position: absolute; inset-inline: 0; top: 50%; height: 1px; background: #cfcfcf; }
  .prog .fill { position: absolute; left: 0; top: 50%; height: 1px; margin-top: 0; background: var(--ink); width: 0; }
  .prog .fill.thick { height: 2px; margin-top: -.5px; }

  /* full screen: only the book, a small way out in the corner */
  .full header, .full footer { display: none !important; }
  .full, .full body { background: #000; }
  .full #book { top: 0; bottom: 0; }
  .full .arrow { top: 50%; background: transparent; border-color: rgba(255,255,255,.18); color: rgba(255,255,255,.5); opacity: .5; }
  .full .arrow:hover { opacity: 1; border-color: rgba(255,255,255,.5); }
  .full.quiet .arrow { opacity: 0; pointer-events: none; }
  .full.quiet #book canvas { cursor: none; }
  /* loading: a small book whose pages keep turning, until the real one is ready */
  /* a guest's blessing, enlarged */
  .wc { position: fixed; inset: 0; z-index: 25; background: rgba(20,18,14,0); backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); display: grid; place-items: center; padding: 20px; transition: background .35s, backdrop-filter .35s, -webkit-backdrop-filter .35s; }
  .wc[hidden] { display: none; } .wc.in { background: rgba(20,18,14,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .wcard { position: relative; max-width: 100%; max-height: 92vh; max-height: 92svh; overflow: auto; background: #fff; border-radius: 30px; padding: 6px 6px 20px;
           opacity: 0; transform: scale(.4); transition: transform .5s cubic-bezier(.2,1.2,.35,1), opacity .25s; }
  .wc.in .wcard { opacity: 1; transform: none; }
  .wmedia { position: relative; border-radius: 24px; overflow: hidden; background: linear-gradient(100deg, #f1eee7 30%, #faf8f3 50%, #f1eee7 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
  .wmedia.ready { animation: none; background: #f1eee7; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .wmedia img, .wmedia video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .wmedia img { opacity: 1; } .wmedia video { opacity: 0; transition: opacity .5s; }
  .wmedia.playing video { opacity: 1; }
  .wmedia img[hidden], .wmedia video[hidden] { display: none; }
  .wmedia .spin { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px; border-radius: 50%; border: 3px solid rgba(255,255,255,.5); border-top-color: #fff; animation: spin .8s linear infinite; display: none; }
  .wmedia:not(.playing):not(.failed) video:not([hidden]) ~ .spin { display: block; }
  .wmedia.failed video { display: none; }
  .wmedia.muted.playing::after { content: "הקישו לשמיעה 🔊"; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); white-space: nowrap; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; pointer-events: none; }
  .wmedia.failed::after { content: "הסרטון לא נתמך בדפדפן הזה"; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); white-space: nowrap; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wc.textonly .wmedia { display: none; } .wc.textonly .wcard { padding: 48px 34px 28px; width: max-content; min-width: 240px; max-width: min(440px, calc(100vw - 40px)); }
  .wmsg { font-family: "Hand", cursive; color: #1f2d5a; font-size: 24px; line-height: 1.45; padding: 16px 18px 0; white-space: pre-wrap; }
  .wname { font-family: "Hand", cursive; color: #1f2d5a; font-size: 22px; padding: 12px 18px 0; text-align: left; }
  .wc.textonly .wmsg { font-size: 30px; text-align: center; padding: 0; }
  .wc.textonly .wname { text-align: center; padding: 16px 0 0; }
  .wx { position: absolute; top: 14px; left: 14px; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: rgba(22,20,15,.55); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 2; }
  .wx svg { display: block; }
  .wc.textonly .wx { background: #f1eee7; color: #16140f; }
  .loader { position: fixed; inset: 0; z-index: 20; background: #fff; display: grid; place-items: center; transition: opacity .6s var(--ease), visibility 0s linear .6s; }
  .ready .loader { opacity: 0; visibility: hidden; }
  .lb { position: relative; width: 72px; height: 48px; perspective: 420px; }
  .lb i { position: absolute; top: 0; width: 36px; height: 48px; border: 1.5px solid var(--ink); background: #fff; box-sizing: border-box; }
  .lb .l { left: 0; border-right-width: 1.5px; }
  .lb .r { right: 0; }
  .lb .f { left: 36px; transform-origin: left center; animation: flip 1.3s cubic-bezier(.6, .05, .3, 1) infinite; background: #fff; }
  .lb .f::before { content: ""; position: absolute; inset: 8px 7px; border-top: 1.5px solid rgba(17,17,17,.35); border-bottom: 1.5px solid rgba(17,17,17,.35); }
  @keyframes flip { 0% { transform: rotateY(0); } 55%, 100% { transform: rotateY(-180deg); } }
  .loader span { position: absolute; margin-top: 110px; font-size: 13px; color: var(--soft); }
  /* TV mode: only the book, playing by itself, with a QR to add a wish */
  .tvqr, .tvstart { display: none; }
  .tv header, .tv footer, .tv .arrow { display: none !important; }
  .tv #book { top: 0; bottom: 0; }
  .tv .tvqr { display: flex; position: fixed; bottom: 32px; inset-inline-start: 32px; z-index: 6; align-items: center; gap: 18px; background: #fff; padding: 16px 22px 16px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
  .tv .tvqr img { width: 120px; height: 120px; }
  .tv .tvqr b { display: block; font-size: 20px; font-weight: 600; }
  .tv .tvqr span { display: block; font-size: 14px; font-weight: 400; color: var(--soft); margin-top: 4px; }
  .tv .tvstart { display: grid; place-items: center; position: fixed; inset: 0; z-index: 9; background: rgba(255,255,255,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor: pointer; border: 0; }
  .tv .tvstart span { background: var(--ink); color: #fff; padding: 18px 32px; font-size: 20px; font-weight: 500; }
  video#film { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  /* phone: the video alone, full screen */
  .vfull { position: fixed; inset: 0; z-index: 40; background: #000; }
  .vfull[hidden] { display: none; }
  .vfull video#film { position: absolute; left: 50%; top: 50%; width: 100vw; height: 100vh; height: 100dvh; transform: translate(-50%, -50%); opacity: 1; pointer-events: none; object-fit: contain; background: #000; }
  @media (orientation: portrait) {   /* held upright: lay the video along the long side */
    .vfull video#film { width: 100vh; width: 100dvh; height: 100vw; transform: translate(-50%, -50%) rotate(90deg); }
  }
  .vfullx { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; z-index: 2; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; transition: opacity .5s; }
  .vfull.calm .vfullx { opacity: 0; }
  body.vfullon { overflow: hidden; }
  video#film:fullscreen { width: 100%; height: 100%; opacity: 1; background: #000; }

  @media (max-width: 720px), (max-height: 500px) {
    :root { --bar: 60px; }
    header { padding: 0 14px; gap: 8px; } .tools .wide { display: none; }
    .brand { font-size: 15px; gap: 8px; } .brand svg { width: 22px; height: 22px; }
    header .b { height: 36px; min-width: 36px; padding: 0 10px; font-size: 13px; gap: 6px; }
    #addLink span { display: none; } #addLink .plus { display: block; }
    footer { grid-template-columns: auto 1fr auto; } footer .strip { display: none; }
    .arrow.l { left: 10px; } .arrow.r { right: 10px; }
  }
  @media (max-width: 400px) {
    #watch { padding: 0 11px; } #watchTxt { display: none; }      /* very narrow phones: the play button keeps only its icon */
    .brand { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; } }
</style>
</head>
<body data-state="front">
<div class="loader" aria-hidden="true"><div class="lb"><i class="l"></i><i class="r"></i><i class="f"></i></div><span>מטר · בר מצווה</span></div>
<header>
  <div class="brand">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M6 7.5h13v16H6z"/><path d="M6 7.5 9 4.5h13v16l-3 3"/><path d="M19 7.5l3-3"/><path d="M8.2 5.3h13M7.4 6.1h13" stroke-width="1" opacity=".55"/></svg>
    <span>מטר · בר מצווה</span>
  </div>
  <nav class="tools">
    <button class="b icon" id="full" aria-label="מסך מלא"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
    <a class="b" id="addLink" href="../add/"><svg class="plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg><span>הוסיפו ברכה</span></a>
    <button class="b dark" id="watch"><svg class="ic-play" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11L13 8z"/></svg><svg class="ic-pause" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3" height="11"/><rect x="9.5" y="2.5" width="3" height="11"/></svg><span id="watchTxt">לצפייה בסרטון</span></button>
  </nav>
</header>

<div class="glow" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
<div id="book" aria-label="מטר · בר מצווה"></div>

<button class="fullexit" id="fullExit" aria-label="יציאה ממסך מלא"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
<button class="arrow l" id="left" aria-label="אחורה"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 3 5 8l5 5"/></svg></button>
<button class="arrow r" id="right" aria-label="קדימה"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m6 3 5 5-5 5"/></svg></button>


<footer>
  <div class="prog">
    <span id="pa">כריכה</span>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <span id="pb">3</span>
  </div>
  <div class="strip" id="strip" aria-label="pages"></div>
  <div class="ctl">
    <button class="b small open-ed" id="openBook">פתחו את הספר</button>
    <button class="b small close-ed" id="closeBook">סגירת הספר</button>
  </div>
</footer>

<div class="tvqr" aria-hidden="true">
  <img src="../qr.svg" alt="">
  <div><b>רוצים להוסיף ברכה?</b><span>סרקו, כתבו ברכה והוסיפו תמונה</span></div>
</div>
<button class="tvstart" id="tvStart"><span>הפעלת הספר</span></button>

<video id="film" playsinline preload="auto" poster="../poster.jpg"></video>
