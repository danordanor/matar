<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="{{base}}poster.jpg">
<meta name="theme-color" content="#ebe6dc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&text=%E3%83%9E%E3%82%BF%E3%83%AB&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Bellefair"; src: url({{base}}fonts/bellefair-hebrew-400-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Bellefair"; src: url({{base}}fonts/bellefair-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; font-display: swap; }
  @font-face { font-family: "Inter"; font-weight: 300; src: url({{base}}fonts/inter-latin-300-normal.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Inter"; font-weight: 400; src: url({{base}}fonts/inter-latin-400-normal.woff2) format("woff2"); font-display: swap; }
</style>
<style>
  :root { --bg: #ebe6dc; --ink: #1b1a17; --soft: #8a8378; --light: #f4f1ea; --ease: cubic-bezier(.22, 1, .36, 1); --pad: clamp(18px, 3vw, 40px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 40%, #f4f0e8 0%, var(--bg) 60%, #ded7ca 100%); color: var(--ink); font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  #book { position: fixed; inset: 0; opacity: 0; transition: opacity 1.6s var(--ease); }
  .ready #book { opacity: 1; }
  #book canvas { display: block; touch-action: pan-y; }

  /* postcard frame: a hairline border with the labels sitting on it */
  .frame { position: fixed; inset: var(--pad); border: 1px solid rgba(27,26,23,.12); pointer-events: none; }
  .label { position: fixed; top: calc(var(--pad) + 22px); left: 50%; transform: translateX(-50%); font-family: "Bellefair", serif; font-size: 18px; letter-spacing: .04em; white-space: nowrap; }
  .lang { position: fixed; top: calc(var(--pad) + 14px); inset-inline-end: calc(var(--pad) + 16px); font-size: 12px; letter-spacing: .14em; color: var(--soft); text-decoration: none; transition: color .3s; }
  .lang:hover { color: var(--ink); }

  .nav { position: fixed; left: 50%; bottom: calc(var(--pad) + 14px); transform: translateX(-50%); display: flex; align-items: center; gap: 18px; direction: ltr; white-space: nowrap; }
  .nav button { width: 34px; height: 34px; position: relative; }
  .nav button::before { content: ""; position: absolute; top: 50%; left: 50%; width: 9px; height: 9px; border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
  .nav .prev::before { transform: translate(-30%, -50%) rotate(-45deg); }
  .nav .next::before { transform: translate(-70%, -50%) rotate(135deg); }
  .nav .count { font-size: 12px; letter-spacing: .14em; font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; color: var(--soft); }
  .nav .film { white-space: nowrap; display: inline-flex; align-items: center; gap: 10px; font-family: "Bellefair", serif; font-size: 17px; padding-inline-start: 18px; border-inline-start: 1px solid rgba(27,26,23,.15); }
  .nav .film::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 5px 0 5px 8px; border-color: transparent transparent transparent var(--ink); }

  .hint { position: fixed; left: 50%; bottom: calc(var(--pad) + 66px); white-space: nowrap; transform: translateX(-50%); font-family: "Bellefair", serif; font-size: 17px; color: var(--soft); transition: opacity .8s var(--ease); animation: pulse 2.8s ease-in-out infinite; }
  .hint.off { opacity: 0; animation: none; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* ---------- in-book film controls: two hairlines ---------- */
  .ctl { position: fixed; left: 50%; bottom: calc(var(--pad) + 22px); transform: translateX(-50%); width: min(720px, calc(100vw - 4 * var(--pad))); display: flex; align-items: center; gap: 18px; direction: ltr; opacity: 0; pointer-events: none; transition: opacity .8s var(--ease); }
  [data-state="open"] .ctl { opacity: 1; pointer-events: auto; transition-delay: .9s; }
  .ctl .time { font: 300 12px/1 "Inter", sans-serif; letter-spacing: .08em; font-variant-numeric: tabular-nums; min-width: 3.2em; color: var(--ink); }
  .ctl .end { text-align: right; }
  .track { position: relative; flex: 1; height: 26px; cursor: pointer; }
  .track .line, .track .fill, .track .buf { position: absolute; left: 0; top: 50%; height: 1px; }
  .track .line { right: 0; background: rgba(27,26,23,.18); transform: scaleX(0); transition: transform 1.2s var(--ease) 1s; }
  [data-state="open"] .track .line { transform: scaleX(1); }
  .track .buf { background: rgba(27,26,23,.12); width: 0; }
  .track .fill { background: var(--ink); width: 0; }
  .track .knob { position: absolute; top: 50%; left: 0; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--ink); transform: scale(0); transition: transform .3s var(--ease); }
  .track:hover .knob { transform: scale(1); }
  .ctl .btn { font: 300 11px/1 "Inter", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); transition: color .3s; white-space: nowrap; }
  .ctl .btn:hover { color: var(--ink); }
  .vol { position: fixed; inset-inline-end: calc(var(--pad) + 22px); top: 50%; height: 30vh; transform: translateY(-50%); width: 26px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .8s var(--ease); }
  [data-state="open"] .vol { opacity: 1; pointer-events: auto; transition-delay: 1.1s; }
  .vol .vline, .vol .vfill { position: absolute; left: 50%; width: 1px; bottom: 0; }
  .vol .vline { top: 0; background: rgba(27,26,23,.18); }
  .vol .vfill { background: var(--ink); height: 100%; }
  .hint { transition: opacity .6s var(--ease); }
  [data-state="open"] .hint { opacity: 0; animation: none; }
  [data-state="open"] .lang { opacity: .4; }
  video#film { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  video#film:fullscreen { width: 100%; height: 100%; opacity: 1; background: #000; }

  @media (max-width: 600px) { .vol { display: none; } .ctl { gap: 12px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div id="book" aria-label="{{title}}"></div>
<div class="frame" aria-hidden="true"></div>
<div class="label">{{top}}</div>
<a class="lang" href="{{other}}">{{other_label}}</a>
<p class="hint" id="hint" data-front="{{hint}}" data-back="{{hint_back}}">{{hint}}</p>
<div class="ctl" id="ctl">
  <span class="time" id="cur">0:00</span>
  <div class="track" id="track"><div class="line"></div><div class="buf" id="buf"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
  <span class="time end" id="dur">2:38</span>
  <button class="btn" id="full">{{full}}</button>
</div>
<div class="vol" id="vol" aria-label="volume"><div class="vline"></div><div class="vfill" id="vfill"></div></div>
<video id="film" playsinline preload="auto" poster="{{base}}poster.jpg"></video>

<script>window.BOOK = {{book_json}};</script>
<script src="{{base}}lib/hls.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const v = $("film"), fill = $("fill"), knob = $("knob"), buf = $("buf"), track = $("track"), cur = $("cur"), dur = $("dur"), vol = $("vol"), vfill = $("vfill"), hint = $("hint");
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  v.addEventListener("loadedmetadata", () => { dur.textContent = fmt(v.duration); });
  let scrub = false;
  (function tick() {
    const d = v.duration || 0, p = d ? v.currentTime / d : 0;
    if (!scrub) { fill.style.width = p * 100 + "%"; knob.style.left = p * 100 + "%"; cur.textContent = fmt(v.currentTime); }
    if (d && v.buffered.length) buf.style.width = v.buffered.end(v.buffered.length - 1) / d * 100 + "%";
    requestAnimationFrame(tick);
  })();
  const rx = (e) => { const r = track.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  const seek = (p) => { if (v.duration) v.currentTime = p * v.duration; fill.style.width = p * 100 + "%"; knob.style.left = p * 100 + "%"; };
  track.addEventListener("pointerdown", (e) => { scrub = true; track.setPointerCapture(e.pointerId); seek(rx(e)); });
  track.addEventListener("pointermove", (e) => { if (scrub) seek(rx(e)); });
  track.addEventListener("pointerup", () => { scrub = false; });
  const ry = (e) => { const r = vol.getBoundingClientRect(); return Math.min(1, Math.max(0, (r.bottom - e.clientY) / r.height)); };
  let vd = false;
  vol.addEventListener("pointerdown", (e) => { vd = true; vol.setPointerCapture(e.pointerId); v.volume = ry(e); v.muted = v.volume === 0; });
  vol.addEventListener("pointermove", (e) => { if (vd) { v.volume = ry(e); v.muted = v.volume === 0; } });
  vol.addEventListener("pointerup", () => { vd = false; });
  v.addEventListener("volumechange", () => { vfill.style.height = (v.muted ? 0 : v.volume) * 100 + "%"; });
  $("full").addEventListener("click", () => { if (v.requestFullscreen) v.requestFullscreen(); else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen(); });
  new MutationObserver(() => { const st = document.body.dataset.state; hint.textContent = st === "back" ? hint.dataset.back : hint.dataset.front; }).observe(document.body, { attributes: true, attributeFilter: ["data-state"] });
})();
</script>
<script type="module" src="{{base}}book.js"></script>
</body>
</html>
