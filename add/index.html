<style>
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(../fonts/plex-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(../fonts/plex-hebrew-500.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(../fonts/plex-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(../fonts/plex-latin-500.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Hand"; font-weight: 400; src: url(../fonts/hand-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Hand"; font-weight: 400; src: url(../fonts/hand-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; font-display: swap; }

  :root { --ink: #16140f; --pen: #1f2d5a; --soft: #9a948a; --ease: cubic-bezier(.22, 1, .36, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #f3f1ec; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "Swiss", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 20px;
         background: linear-gradient(160deg, #f8f7f3, #efece5); position: relative; isolation: isolate; }
  body::before, body::after { content: ""; position: fixed; z-index: -1; border-radius: 50%; filter: blur(70px); pointer-events: none; will-change: transform; }
  body::before { width: 70vmax; height: 70vmax; top: -30vmax; right: -20vmax; background: rgba(255,210,74,.42); animation: driftA 38s ease-in-out infinite alternate; }
  body::after { width: 55vmax; height: 55vmax; bottom: -25vmax; left: -15vmax; background: rgba(244,166,42,.22); animation: driftB 47s ease-in-out infinite alternate; }
  @keyframes driftA { to { transform: translate(-18vmax, 14vmax) scale(1.15); } }
  @keyframes driftB { to { transform: translate(16vmax, -14vmax) scale(.9); } }
  @media (prefers-reduced-motion: reduce) { body::before, body::after { animation: none; } }
  button, input, textarea { font: inherit; color: inherit; }

  /* a small card on top of a neat pile of others */
  .stack { position: relative; width: min(296px, 100%); }
  .stack::before, .stack::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: #fff; border-radius: 30px; transform-origin: 50% 0; }
  .stack::before { transform: translateY(-22px) scale(.86); opacity: .45; }
  .stack::after { transform: translateY(-11px) scale(.93); opacity: .7; box-shadow: 0 10px 30px -18px rgba(40,30,10,.3); }
  .card { position: relative; z-index: 1; background: #fff; border-radius: 30px; padding: 4px;
          box-shadow: 0 30px 50px -28px rgba(40, 30, 10, .45), 0 0 0 1px rgba(0,0,0,.04); }

  .photo { position: relative; aspect-ratio: 1 / 1; border-radius: 26px; overflow: hidden; background: #f1eee7; cursor: pointer; }
  .photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 3; }
  .photo .hint { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; transition: opacity .3s; }
  .photo .hint svg { width: 86px; height: 86px; }
  .photo .hint span { font-size: 12px; color: rgba(22,20,15,.5); }
  /* two quiet choices: a photo, or a video */
  .pick { position: absolute; bottom: 12px; left: 0; right: 0; z-index: 4; display: flex; justify-content: center; gap: 8px; }
  .pick label { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px 0 11px; border-radius: 999px; background: #fff; color: var(--ink);
                font-size: 12.5px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.06); cursor: pointer; transition: transform .25s var(--ease), box-shadow .25s; }
  .pick label:active { transform: scale(.96); }
  .pick svg { width: 16px; height: 16px; }
  .pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .photo.has .pick, .photo.vid .pick { display: none; }
  .photo img, .photo video { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo.has img, .photo.vid video { display: block; } .photo.has .hint, .photo.vid .hint { opacity: 0; }
  .photo.vid img { display: none; }
  .photo .clear { position: absolute; top: 10px; left: 10px; z-index: 4; background: rgba(22,20,15,.72); color: #fff; border: 0; width: 28px; height: 28px; border-radius: 50%; display: none; cursor: pointer; font-size: 13px; backdrop-filter: blur(6px); }
  .photo.has .clear, .photo.vid .clear { display: grid; place-items: center; }
  /* in-page camera */
  .photo #live { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #111; }
  .photo.cam #live { display: block; } .photo.cam .hint { opacity: 0; }
  .photo.cam:not(.on) #live { visibility: hidden; }
  .photo.cam { background: #141414; }
  .camhint { position: absolute; inset: 0 24px 90px; z-index: 3; display: none; place-items: center; text-align: center; color: rgba(255,255,255,.7); font-size: 13px; line-height: 1.5; }
  .photo.cam:not(.on) .camhint { display: grid; }
  .camui .flip { visibility: hidden; } .photo.flipok .camui .flip { visibility: visible; } .photo.flipok.recording .camui .flip { visibility: hidden; }
  .camui { position: absolute; left: 0; right: 0; bottom: 14px; z-index: 4; display: none; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 14px; }
  .photo.cam .camui { display: grid; }
  .camui .gal { justify-self: start; } .camui .flip { justify-self: end; }
  .shoot { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff; background: rgba(255,255,255,.18); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(4px); }
  .shoot span { width: 48px; height: 48px; border-radius: 50%; background: #fff; transition: all .25s var(--ease); }
  .photo.vmode .shoot span { background: #ff3b30; }
  .photo.recording .shoot span { width: 24px; height: 24px; border-radius: 7px; }
  .gal, .flip { position: relative; height: 32px; min-width: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: rgba(0,0,0,.42); color: #fff; font-size: 12px; display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(6px); }
  .flip { padding: 0; width: 32px; } .flip svg { width: 17px; height: 17px; }
  .gal input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .timer { position: absolute; top: 12px; right: 12px; z-index: 4; display: none; padding: 4px 10px; border-radius: 999px; background: #ff3b30; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
  .photo.recording .timer { display: block; }
  .photo.recording .gal, .photo.recording .flip { visibility: hidden; }
  .photo .tag { position: absolute; bottom: 8px; right: 8px; z-index: 4; display: none; padding: 4px 9px; border-radius: 999px; background: rgba(22,20,15,.6); color: #fff; font-size: 12px; backdrop-filter: blur(6px); }
  .photo.vid .tag { display: block; }

  .write { padding: 14px 14px 0; }
  .hand { font-family: "Hand", "Swiss", cursive; color: var(--pen); background: transparent; border: 0; outline: none; width: 100%; -webkit-appearance: none; border-radius: 0; display: block; }
  .hand::placeholder { color: rgba(31,45,90,.28); }
  .msg { font-size: 21px; line-height: 1.45; min-height: 62px; max-height: 26svh; resize: none; overflow: auto; }
  .name { font-size: 19px; line-height: 1.3; margin-top: 4px; text-align: left; }
  .name::placeholder { text-align: left; }

  .send { margin: 14px -10px 0; width: calc(100% + 20px); height: 46px; background: transparent; color: var(--ink); border: 1.5px solid rgba(22,20,15,.22); border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer;
          transition: background .3s, color .3s, border-color .3s, transform .3s var(--ease); }
  .send.ready { background: var(--ink); color: #fff; border-color: var(--ink); }
  .send:active { transform: scale(.98); }
  .send[disabled] { opacity: .45; cursor: default; }
  /* first: how would you like to bless? */
  .ask { padding: 26px 16px 16px; }
  .ask h2 { font-weight: 500; font-size: 20px; letter-spacing: -.01em; text-align: center; }
  .ask p { text-align: center; font-size: 13px; color: var(--soft); margin-top: 2px; }
  .ways { display: grid; gap: 8px; margin-top: 18px; }
  .ways label, .ways button { position: relative; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 8px 0 18px; border-radius: 999px; background: #f6f4ef; border: 0; text-align: right; font-size: 15px; font-weight: 500; cursor: pointer; transition: transform .25s var(--ease), background .25s; width: 100%; }
  .ways label:active, .ways button:active { transform: scale(.98); background: #efece5; }
  .ways i { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .ways svg { width: 20px; height: 20px; }
  .ways small { display: block; font-size: 12px; font-weight: 400; color: var(--soft); margin-top: 1px; }
  .ways input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .card.step2 .ask { display: none; }
  .card:not(.step2) .photo, .card:not(.step2) .write { display: none; }
  .card.text .photo { display: none; }
  .card.text .msg { min-height: 150px; } .card.text .write { padding-top: 26px; }
  .card.text .x { display: grid; }
  .x { position: absolute; top: 12px; left: 12px; z-index: 4; width: 30px; height: 30px; border-radius: 50%; border: 0; background: #f1eee7; color: var(--ink); display: none; place-items: center; cursor: pointer; font-size: 13px; }
  .back { display: none; }
  .err { color: #b3261e; font-size: 13px; margin-top: 10px; text-align: center; }
  .err:empty { display: none; }

  .done { display: none; text-align: center; padding: 48px 16px 36px; }
  .done h2 { font-family: "Hand", cursive; font-weight: 400; color: var(--pen); font-size: 56px; }
  .done p { margin-top: 6px; font-size: 15px; color: var(--soft); }
  .sent form { display: none; } .sent .done { display: block; }
</style>
</head>
<body>
<div class="stack"><div class="card">
<form id="f" novalidate>
  <button type="button" class="x" id="x" aria-label="חזרה">✕</button>
  <div class="ask">
    <h2>איך תרצו לברך את מטר?</h2>
    <p>הברכה תיכנס לספר הבר מצווה שלו</p>
    <div class="ways">
      <button type="button" id="wText"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h9M5 17h12"/></svg></i><span>במילים<small>כמה שורות בכתב יד</small></span></button>
      <label id="wPic"><input type="file" id="pic" accept="image/*"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="4"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8.5 6l1.2-2h4.6l1.2 2"/></svg></i><span>עם תמונה<small>שלכם עם מטר</small></span></label>
      <label id="wVid"><input type="file" id="cam" accept="video/*" capture="user"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="4"/><path d="M16 11l5-3v8l-5-3"/></svg></i><span>בוידאו<small>צילום קצר, עד דקה</small></span></label>
    </div>
  </div>
  <div class="photo" id="drop">
    <input type="file" id="file" accept="image/*,video/*" tabindex="-1">
    <div class="hint">
      <svg viewBox="0 0 150 150" fill="none" stroke="#1f2d5a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="60" cy="58" r="13"/>
        <path d="M34 112c0-18 11-29 26-29s26 11 26 29"/>
        <circle cx="97" cy="72" r="10.5"/>
        <path d="M78 112c0-14 8-23 19-23s19 9 19 23"/>
      </svg>
      <span>אתם ומטר</span>
    </div>
    <img id="preview" alt="">
    <video id="live" muted playsinline autoplay></video>
    <span class="timer" id="timer">0:00</span>
    <span class="camhint" id="camhint"></span>
    <div class="camui">
      <label class="gal"><input type="file" id="gal" accept="image/*,video/*">מהגלריה</label>
      <button type="button" class="shoot" id="shoot" aria-label="צילום"><span></span></button>
      <button type="button" class="flip" id="flip" aria-label="החלפת מצלמה"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a6 6 0 0 1 11-2M16 12a6 6 0 0 1-11 2"/><path d="M15 3v3h-3M5 17v-3h3"/></svg></button>
    </div>
    <video id="vprev" muted loop playsinline autoplay preload="auto"></video>
    <span class="tag">וידאו</span>
    <button type="button" class="clear" id="clear" aria-label="הסרה">✕</button>
  </div>

  <div class="write">
    <textarea class="hand msg" id="msg" maxlength="700" placeholder="מטר יקר," required rows="2"></textarea>
    <input class="hand name" type="text" id="name" maxlength="60" autocomplete="name" placeholder="— השם שלכם" required>
    <p class="err" id="err"></p>
    <button class="send" id="send" type="submit">שליחת הברכה</button>
    <button class="back" id="back" type="button">חזרה</button>
  </div>
</form>

<section class="done">
  <h2>תודה!</h2>
  <p>הברכה נכנסה לספר של מטר.</p>
</section>
</div></div>

<script>
(() => {
  const SB = "https://rjtuakbvpfookqutbych.supabase.co", KEY = "sb_publishable_HhbL6xXv99EtHFn00yRfSA_w9mLKOhr";
  const H = { apikey: KEY, Authorization: "Bearer " + KEY };
  const $ = (id) => document.getElementById(id);
  const msg = $("msg"), file = $("file"), pic = $("pic"), cam = $("cam"), drop = $("drop"), preview = $("preview"), vprev = $("vprev"), err = $("err"), send = $("send");
  let blob = null, vid = null;   // photo (or video poster) jpeg, and the video file
  const MAXV = 45 * 1024 * 1024;
  const card = document.querySelector(".card"), nameEl = $("name");
  const step2 = (kind) => { card.classList.add("step2"); card.classList.toggle("text", kind === "text"); if (kind === "text") setTimeout(() => msg.focus(), 50); ready(); };
  const ready = () => send.classList.toggle("ready", !!(nameEl.value.trim() && msg.value.trim()));
  $("wText").addEventListener("click", () => step2("text"));
  $("x").addEventListener("click", () => $("clear").click());
  $("back").addEventListener("click", () => { card.classList.remove("step2", "text"); $("clear").click(); });
  nameEl.addEventListener("input", ready);

  msg.addEventListener("input", () => { msg.style.height = "auto"; msg.style.height = msg.scrollHeight + "px"; ready(); });

  // shrink the photo on the phone before upload (max 1600px, jpeg)
  async function shrink(f) {
    const url = URL.createObjectURL(f);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return await new Promise((res) => c.toBlob(res, "image/jpeg", .86));
  }
  // a video: show it, and grab its first frame as the picture for the book page
  async function takeVideo(f) {
    if (f.size > MAXV) throw new Error("big");
    vid = f; blob = null;
    vprev.src = URL.createObjectURL(f); vprev.load(); drop.classList.add("vid");
    vprev.play().catch(() => {});
    // the first frame becomes the picture on the book page (best effort; iOS only decodes once it plays)
    const frame = () => new Promise((res) => {
      const done = () => { try {
        if (!vprev.videoWidth) return res();
        const k = Math.min(1, 1200 / Math.max(vprev.videoWidth, vprev.videoHeight));
        const c = document.createElement("canvas"); c.width = Math.round(vprev.videoWidth * k); c.height = Math.round(vprev.videoHeight * k);
        c.getContext("2d").drawImage(vprev, 0, 0, c.width, c.height);
        c.toBlob((b) => { if (vid === f) blob = b; res(); }, "image/jpeg", .85);
      } catch (e) { res(); } };
      const t = setTimeout(done, 2500);
      vprev.addEventListener("timeupdate", function h() { if (vprev.currentTime > .3) { vprev.removeEventListener("timeupdate", h); clearTimeout(t); done(); } });
    });
    await frame();
  }
  async function take(f) {
    err.textContent = ""; if (!f) return;
    step2("media");
    try {
      if (f.type.startsWith("video/")) await takeVideo(f);
      else { blob = await shrink(f); vid = null; preview.src = URL.createObjectURL(blob); drop.classList.add("has"); }
    } catch (e) {
      err.textContent = e.message === "big" ? "הסרטון גדול מדי (עד 45MB). נסו סרטון קצר יותר." : "לא הצלחנו לפתוח את הקובץ. נסו אחר.";
      blob = null; vid = null;
    }
  }
  // ---- in-page camera: works on computers too, and keeps videos small ----
  // the browser only asks for the camera when the round button is pressed
  const live = $("live"), shoot = $("shoot"), timer = $("timer"), gal = $("gal"), flip = $("flip"), camhint = $("camhint");
  let stream = null, mode = "photo", rec = null, chunks = [], tick = null, cams = [], camIdx = -1, mirror = true;
  const canCam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const canRec = typeof MediaRecorder !== "undefined";
  const stopStream = () => { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; live.srcObject = null; drop.classList.remove("on"); };
  const stopCam = () => { stopStream(); drop.classList.remove("cam", "vmode", "recording", "flipok"); clearInterval(tick); };
  function openCam(m) {
    mode = m; err.textContent = ""; step2("media");
    drop.classList.add("cam"); drop.classList.toggle("vmode", m === "video");
    camhint.textContent = m === "video" ? "לחצו על העיגול כדי להתחיל לצלם" : "לחצו על העיגול כדי לפתוח את המצלמה";
    gal.accept = m === "video" ? "video/*" : "image/*";
  }
  async function startStream() {
    stopStream();
    const id = cams[camIdx] && cams[camIdx].deviceId;
    const video = { width: { ideal: 1280 }, height: { ideal: 1280 }, ...(id ? { deviceId: { exact: id } } : { facingMode: "user" }) };
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: mode === "video" });
    live.srcObject = stream; await live.play().catch(() => {});
    const set = stream.getVideoTracks()[0].getSettings();
    mirror = set.facingMode ? set.facingMode === "user" : true;      // front camera mirrored, back camera as is
    live.style.transform = mirror ? "scaleX(-1)" : "none";
    drop.classList.add("on");
    // after the first permission the camera names are known: show the flip button only if there are two
    try {
      cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
      if (camIdx < 0) camIdx = Math.max(0, cams.findIndex((d) => d.deviceId === set.deviceId));
      drop.classList.toggle("flipok", cams.length > 1);
    } catch (e) {}
  }
  const pickType = () => ["video/mp4;codecs=avc1,mp4a", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"].find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  function record() {
    const type = pickType(); chunks = [];
    rec = new MediaRecorder(stream, { ...(type ? { mimeType: type } : {}), videoBitsPerSecond: 2500000, audioBitsPerSecond: 96000 });
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const t = (rec.mimeType || type || "video/mp4").split(";")[0];
      const f = new File(chunks, "wish." + (t.includes("webm") ? "webm" : "mp4"), { type: t });
      stopCam(); takeVideo(f).catch(() => { err.textContent = "לא הצלחנו לשמור את הסרטון. נסו שוב."; });
    };
    rec.start(500); drop.classList.add("recording");
    const t0 = Date.now(); timer.textContent = "0:00";
    tick = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); timer.textContent = "0:" + String(s).padStart(2, "0"); if (s >= 60 && rec.state === "recording") rec.stop(); }, 250);
  }
  shoot.addEventListener("click", async () => {
    if (rec && rec.state === "recording") return rec.stop();
    if (!stream) {
      shoot.disabled = true;
      try { await startStream(); } catch (e) { shoot.disabled = false; return err.textContent = "אין גישה למצלמה. אפשר לבחור מהגלריה."; }
      shoot.disabled = false;
      if (mode === "video") record();        // video: the same press starts recording
      return;                                // photo: the camera opens, the next press takes it
    }
    if (mode === "video") return record();
    const v = live, s = Math.min(v.videoWidth, v.videoHeight), c = document.createElement("canvas"); c.width = c.height = Math.min(1400, s);
    const g = c.getContext("2d"); if (mirror) { g.translate(c.width, 0); g.scale(-1, 1); }
    g.drawImage(v, (v.videoWidth - s) / 2, (v.videoHeight - s) / 2, s, s, 0, 0, c.width, c.height);
    const b = await new Promise((res) => c.toBlob(res, "image/jpeg", .88)); stopCam();
    blob = b; vid = null; preview.src = URL.createObjectURL(b); drop.classList.add("has");
  });
  flip.addEventListener("click", async () => {
    if (!stream || cams.length < 2 || (rec && rec.state === "recording")) return;
    camIdx = (camIdx + 1) % cams.length;
    try { await startStream(); } catch (e) { err.textContent = "לא הצלחנו להחליף מצלמה."; }
  });
  gal.addEventListener("change", () => { stopCam(); take(gal.files[0]); });
  // the two options open the camera when the browser has one; otherwise they stay plain file pickers
  if (canCam) {
    $("wPic").addEventListener("click", (e) => { e.preventDefault(); openCam("photo"); });
    if (canRec) $("wVid").addEventListener("click", (e) => { e.preventDefault(); openCam("video"); });
  }
  file.addEventListener("change", () => take(file.files[0]));
  pic.addEventListener("change", () => take(pic.files[0]));
  cam.addEventListener("change", () => take(cam.files[0]));
  $("clear").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); if (rec && rec.state === "recording") { rec.onstop = null; rec.stop(); } stopCam(); blob = null; vid = null; file.value = ""; pic.value = ""; cam.value = ""; gal.value = ""; vprev.pause(); vprev.removeAttribute("src"); drop.classList.remove("has", "vid"); card.classList.remove("step2", "text"); });

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = "";
    const name = $("name").value.trim(), message = msg.value.trim();
    if (!name) return err.textContent = "כתבו את השם שלכם.";
    if (!message) return err.textContent = "כתבו ברכה.";
    send.disabled = true; send.textContent = "שולחים…";
    try {
      let photo_path = null, video_path = null; const id = crypto.randomUUID();
      if (blob) {
        photo_path = "wishes/" + id + ".jpg";
        const up = await fetch(`${SB}/storage/v1/object/matar/${photo_path}`, { method: "POST", headers: { ...H, "Content-Type": "image/jpeg" }, body: blob });
        if (!up.ok) throw new Error("upload " + up.status);
      }
      if (vid) {
        send.textContent = "מעלים את הסרטון…";
        let type = (vid.type || "").split(";")[0];
        if (!type) type = /\.mov$/i.test(vid.name) ? "video/quicktime" : /\.webm$/i.test(vid.name) ? "video/webm" : "video/mp4";
        const ext = { "video/quicktime": "mov", "video/webm": "webm", "video/x-m4v": "m4v" }[type] || "mp4";
        video_path = "wishes/" + id + "." + ext;
        const up = await fetch(`${SB}/storage/v1/object/matar/${video_path}`, { method: "POST", headers: { ...H, "Content-Type": type }, body: vid });
        if (!up.ok) throw new Error(up.status === 413 ? "big" : "upload " + up.status);
      }
      const r = await fetch(`${SB}/rest/v1/matar_wishes`, { method: "POST", headers: { ...H, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify({ name, message, photo_path, video_path }) });
      if (!r.ok) throw new Error("insert " + r.status);
      document.body.classList.add("sent");
    } catch (e2) {
      console.warn(e2);
      err.textContent = e2.message === "big" ? "הסרטון ארוך מדי. נסו סרטון קצר יותר." : "משהו לא עבד. נסו שוב בעוד רגע."; send.disabled = false; send.textContent = "שליחת הברכה";
    }
  });
})();
</script>
