<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ברכה למטר</title>
<meta name="description" content="הוסיפו ברכה ותמונה לספר הבר מצווה של מטר">
<meta property="og:title" content="ברכה למטר">
<meta property="og:description" content="הוסיפו ברכה ותמונה לספר הבר מצווה של מטר">
<meta property="og:image" content="../poster.jpg">
<meta name="theme-color" content="#FFD24A">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(../fonts/plex-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(../fonts/plex-hebrew-500.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(../fonts/plex-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(../fonts/plex-latin-500.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Hand"; font-weight: 400; src: url(../fonts/hand-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Hand"; font-weight: 400; src: url(../fonts/hand-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; font-display: swap; }

  :root { --ink: #16140f; --pen: #1f2d5a; --soft: #8a857a; --ease: cubic-bezier(.22, 1, .36, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #FFC83A; }
  body { font-family: "Swiss", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100svh; display: grid; place-items: center; padding: 16px;
         background: linear-gradient(160deg, #FFE27A, #FFC83A 55%, #F4A62A); }
  button, input, textarea { font: inherit; color: inherit; }

  /* one small rounded window, nothing around it */
  .card { width: min(420px, 100%); background: #fff; border-radius: 28px; padding: 28px 26px 22px; position: relative;
          box-shadow: 0 30px 60px -28px rgba(90, 50, 0, .5); }
  .label { font-size: 12px; color: var(--soft); }
  .hand { font-family: "Hand", "Swiss", cursive; color: var(--pen); background: transparent; border: 0; outline: none; width: 100%; -webkit-appearance: none; border-radius: 0; }
  .hand::placeholder { color: rgba(31,45,90,.3); }
  .name { font-size: 34px; line-height: 1.15; margin-top: 2px; }
  .msg { font-size: 23px; line-height: 1.5; min-height: 108px; max-height: 40svh; resize: none; margin-top: 14px; overflow: auto; }

  /* photo slot: a cute rounded frame with a little drawing of you and Matar */
  .photo { position: relative; margin-top: 16px; height: 128px; border-radius: 20px; background: #FFF4CC; overflow: hidden; cursor: pointer;
           display: flex; align-items: center; gap: 14px; padding: 0 18px; transition: background .25s; }
  .photo:hover { background: #FFEEB3; }
  .photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .photo svg { width: 92px; height: 92px; flex: none; }
  .photo .txt { font-size: 15px; line-height: 1.4; }
  .photo .txt small { display: block; font-size: 12px; color: var(--soft); margin-top: 2px; }
  .photo img { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo.has img { display: block; } .photo.has svg, .photo.has .txt { display: none; }
  .photo .clear { position: absolute; top: 10px; left: 10px; background: rgba(22,20,15,.8); color: #fff; border: 0; width: 28px; height: 28px; border-radius: 50%; display: none; z-index: 2; cursor: pointer; font-size: 13px; }
  .photo.has .clear { display: grid; place-items: center; }

  .send { width: 100%; height: 54px; margin-top: 16px; background: var(--ink); color: #fff; border: 0; border-radius: 16px; font-size: 16px; font-weight: 500; cursor: pointer; transition: opacity .2s; }
  .send[disabled] { opacity: .45; cursor: default; }
  .err { color: #b3261e; font-size: 13px; min-height: 1em; margin-top: 10px; text-align: center; }
  .err:empty { display: none; }

  .done { display: none; text-align: center; padding: 36px 10px 26px; }
  .done h2 { font-family: "Hand", cursive; font-weight: 400; color: var(--pen); font-size: 56px; }
  .done p { margin-top: 8px; font-size: 16px; color: var(--soft); }
  .sent form { display: none; } .sent .done { display: block; }
</style>
</head>
<body>
<div class="card">
<form id="f" novalidate>
  <div class="label">ברכה מאת</div>
  <input class="hand name" type="text" id="name" maxlength="60" autocomplete="name" placeholder="השם שלכם" required>
  <textarea class="hand msg" id="msg" maxlength="700" placeholder="מטר יקר," required rows="3"></textarea>

  <div class="photo" id="drop">
    <input type="file" id="file" accept="image/*">
    <svg viewBox="0 0 92 92" fill="none" stroke="#1f2d5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="8" y="14" width="76" height="64" rx="10" fill="#fff"/>
      <!-- you -->
      <circle cx="36" cy="38" r="8"/>
      <path d="M22 70c0-10 6-16 14-16s14 6 14 16"/>
      <!-- matar, a bit shorter -->
      <circle cx="59" cy="46" r="6.5"/>
      <path d="M48 70c0-8 5-13 11-13s11 5 11 13"/>
      <!-- sun -->
      <circle cx="70" cy="26" r="4" fill="#FFC83A" stroke="none"/>
    </svg>
    <div class="txt">תמונה שלכם עם מטר<small>לא חובה · לחצו להוסיף</small></div>
    <img id="preview" alt="">
    <button type="button" class="clear" id="clear" aria-label="הסרת תמונה">✕</button>
  </div>

  <p class="err" id="err"></p>
  <button class="send" id="send" type="submit">שליחת הברכה</button>
</form>

<section class="done">
  <h2>תודה!</h2>
  <p>הברכה שלכם נכנסה לספר של מטר.</p>
</section>
</div>

<script>
(() => {
  const SB = "https://rjtuakbvpfookqutbych.supabase.co", KEY = "sb_publishable_HhbL6xXv99EtHFn00yRfSA_w9mLKOhr";
  const H = { apikey: KEY, Authorization: "Bearer " + KEY };
  const $ = (id) => document.getElementById(id);
  const msg = $("msg"), file = $("file"), drop = $("drop"), preview = $("preview"), err = $("err"), send = $("send");
  let blob = null;

  msg.addEventListener("input", () => { msg.style.height = "auto"; msg.style.height = msg.scrollHeight + "px"; });

  // shrink the photo on the phone before upload (max 1600px, jpeg)
  async function shrink(f) {
    const url = URL.createObjectURL(f);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return await new Promise((res) => c.toBlob(res, "image/jpeg", .86));
  }
  file.addEventListener("change", async () => {
    err.textContent = ""; const f = file.files[0]; if (!f) return;
    try { blob = await shrink(f); preview.src = URL.createObjectURL(blob); drop.classList.add("has"); }
    catch (e) { err.textContent = "לא הצלחנו לפתוח את התמונה. נסו תמונה אחרת."; blob = null; }
  });
  $("clear").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); blob = null; file.value = ""; drop.classList.remove("has"); });

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = "";
    const name = $("name").value.trim(), message = msg.value.trim();
    if (!name) return err.textContent = "כתבו את השם שלכם.";
    if (!message) return err.textContent = "כתבו ברכה.";
    send.disabled = true; send.textContent = "שולחים…";
    try {
      let photo_path = null;
      if (blob) {
        photo_path = "wishes/" + crypto.randomUUID() + ".jpg";
        const up = await fetch(`${SB}/storage/v1/object/matar/${photo_path}`, { method: "POST", headers: { ...H, "Content-Type": "image/jpeg" }, body: blob });
        if (!up.ok) throw new Error("upload " + up.status);
      }
      const r = await fetch(`${SB}/rest/v1/matar_wishes`, { method: "POST", headers: { ...H, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify({ name, message, photo_path }) });
      if (!r.ok) throw new Error("insert " + r.status);
      document.body.classList.add("sent");
    } catch (e2) {
      err.textContent = "משהו לא עבד. נסו שוב בעוד רגע."; send.disabled = false; send.textContent = "שליחת הברכה";
    }
  });
})();
</script>
</body>
</html>
