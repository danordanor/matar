<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ברכה למטר</title>
<meta name="description" content="הוסיפו ברכה ותמונה לספר הבר מצווה של מטר">
<meta property="og:title" content="ברכה למטר">
<meta property="og:description" content="הוסיפו ברכה ותמונה לספר הבר מצווה של מטר">
<meta property="og:image" content="../poster.jpg">
<meta name="theme-color" content="#f3f1ec">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(../fonts/plex-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(../fonts/plex-hebrew-500.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(../fonts/plex-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(../fonts/plex-latin-500.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Hand"; font-weight: 400; src: url(../fonts/hand-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Hand"; font-weight: 400; src: url(../fonts/hand-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; font-display: swap; }

  :root { --ink: #16140f; --pen: #1f2d5a; --soft: #9a948a; --ease: cubic-bezier(.22, 1, .36, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #f3f1ec; }
  body { font-family: "Swiss", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100svh; display: grid; place-items: center; padding: 20px 16px;
         background: linear-gradient(160deg, #f8f7f3, #efece5); position: relative; isolation: isolate; }
  /* two soft colour pools drifting very slowly behind the card */
  body::before, body::after { content: ""; position: fixed; z-index: -1; border-radius: 50%; filter: blur(70px); pointer-events: none; will-change: transform; }
  body::before { width: 70vmax; height: 70vmax; top: -30vmax; right: -20vmax; background: rgba(255,210,74,.42); animation: driftA 38s ease-in-out infinite alternate; }
  body::after { width: 55vmax; height: 55vmax; bottom: -25vmax; left: -15vmax; background: rgba(244,166,42,.22); animation: driftB 47s ease-in-out infinite alternate; }
  @keyframes driftA { to { transform: translate(-18vmax, 14vmax) scale(1.15); } }
  @keyframes driftB { to { transform: translate(16vmax, -14vmax) scale(.9); } }
  @media (prefers-reduced-motion: reduce) { body::before, body::after { animation: none; } }
  button, input, textarea { font: inherit; color: inherit; }

  /* a greeting card: big photo on top, a few handwritten lines below */
  .card { width: min(400px, 100%); background: #fff; border-radius: 32px; overflow: hidden; position: relative;
          box-shadow: 0 40px 70px -34px rgba(40, 30, 10, .35), 0 0 0 1px rgba(0,0,0,.03); }

  .photo { position: relative; aspect-ratio: 1 / 1; background: linear-gradient(150deg, #f6f4ee, #ebe7dd); cursor: pointer; overflow: hidden; }
  .photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 3; }
  .photo .hint { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; transition: opacity .3s; }
  .photo .hint svg { width: 150px; height: 150px; }
  .photo .hint span { position: absolute; bottom: 22px; left: 0; right: 0; font-size: 14px; color: rgba(22,20,15,.6); }
  .photo img { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo.has img { display: block; } .photo.has .hint { opacity: 0; }
  .photo .clear { position: absolute; top: 14px; left: 14px; z-index: 4; background: rgba(22,20,15,.72); color: #fff; border: 0; width: 32px; height: 32px; border-radius: 50%; display: none; cursor: pointer; font-size: 14px; backdrop-filter: blur(6px); }
  .photo.has .clear { display: grid; place-items: center; }

  .write { padding: 24px 26px 22px; }
  .hand { font-family: "Hand", "Swiss", cursive; color: var(--pen); background: transparent; border: 0; outline: none; width: 100%; -webkit-appearance: none; border-radius: 0; display: block; }
  .hand::placeholder { color: rgba(31,45,90,.28); }
  .msg { font-size: 26px; line-height: 1.45; min-height: 76px; max-height: 34svh; resize: none; overflow: auto; }
  .name { font-size: 24px; line-height: 1.3; margin-top: 10px; text-align: left; direction: rtl; }
  .name::placeholder { text-align: left; }

  .send { margin: 18px 0 0; width: 100%; height: 54px; background: var(--ink); color: #fff; border: 0; border-radius: 999px; font-size: 16px; font-weight: 500; cursor: pointer; transition: opacity .2s, transform .3s var(--ease); }
  .send:active { transform: scale(.98); }
  .send[disabled] { opacity: .45; cursor: default; }
  .err { color: #b3261e; font-size: 13px; margin-top: 10px; text-align: center; }
  .err:empty { display: none; }

  .done { display: none; text-align: center; padding: 56px 26px 44px; }
  .done h2 { font-family: "Hand", cursive; font-weight: 400; color: var(--pen); font-size: 60px; }
  .done p { margin-top: 6px; font-size: 16px; color: var(--soft); }
  .sent form { display: none; } .sent .done { display: block; }
</style>
</head>
<body>
<div class="card">
<form id="f" novalidate>
  <div class="photo" id="drop">
    <input type="file" id="file" accept="image/*">
    <div class="hint">
      <svg viewBox="0 0 150 150" fill="none" stroke="#1f2d5a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <!-- you -->
        <circle cx="60" cy="58" r="13"/>
        <path d="M34 112c0-18 11-29 26-29s26 11 26 29"/>
        <!-- matar, a head shorter, leaning in -->
        <circle cx="97" cy="72" r="10.5"/>
        <path d="M78 112c0-14 8-23 19-23s19 9 19 23"/>
        <!-- plus -->
        <circle cx="118" cy="36" r="13" fill="#16140f" stroke="none"/>
        <path d="M118 30v12M112 36h12" stroke="#fff" stroke-width="2.4"/>
      </svg>
      <span>תמונה שלכם עם מטר</span>
    </div>
    <img id="preview" alt="">
    <button type="button" class="clear" id="clear" aria-label="הסרת תמונה">✕</button>
  </div>

  <div class="write">
    <textarea class="hand msg" id="msg" maxlength="700" placeholder="מטר יקר," required rows="2"></textarea>
    <input class="hand name" type="text" id="name" maxlength="60" autocomplete="name" placeholder="— השם שלכם" required>
    <p class="err" id="err"></p>
    <button class="send" id="send" type="submit">שליחת הברכה</button>
  </div>
</form>

<section class="done">
  <h2>תודה!</h2>
  <p>הברכה נכנסה לספר של מטר.</p>
</section>
</div>

<script>
(() => {
  const SB = "https://rjtuakbvpfookqutbych.supabase.co", KEY = "sb_publishable_HhbL6xXv99EtHFn00yRfSA_w9mLKOhr";
  const H = { apikey: KEY, Authorization: "Bearer " + KEY };
  const $ = (id) => document.getElementById(id);
  const msg = $("msg"), file = $("file"), drop = $("drop"), preview = $("preview"), err = $("err"), send = $("send");
  let blob = null;

  msg.addEventListener("input", () => { msg.style.height = "auto"; msg.style.height = msg.scrollHeight + "px"; });

  // shrink the photo on the phone before upload (max 1600px, jpeg)
  async function shrink(f) {
    const url = URL.createObjectURL(f);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return await new Promise((res) => c.toBlob(res, "image/jpeg", .86));
  }
  file.addEventListener("change", async () => {
    err.textContent = ""; const f = file.files[0]; if (!f) return;
    try { blob = await shrink(f); preview.src = URL.createObjectURL(blob); drop.classList.add("has"); }
    catch (e) { err.textContent = "לא הצלחנו לפתוח את התמונה. נסו תמונה אחרת."; blob = null; }
  });
  $("clear").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); blob = null; file.value = ""; drop.classList.remove("has"); });

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = "";
    const name = $("name").value.trim(), message = msg.value.trim();
    if (!name) return err.textContent = "כתבו את השם שלכם.";
    if (!message) return err.textContent = "כתבו ברכה.";
    send.disabled = true; send.textContent = "שולחים…";
    try {
      let photo_path = null;
      if (blob) {
        photo_path = "wishes/" + crypto.randomUUID() + ".jpg";
        const up = await fetch(`${SB}/storage/v1/object/matar/${photo_path}`, { method: "POST", headers: { ...H, "Content-Type": "image/jpeg" }, body: blob });
        if (!up.ok) throw new Error("upload " + up.status);
      }
      const r = await fetch(`${SB}/rest/v1/matar_wishes`, { method: "POST", headers: { ...H, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify({ name, message, photo_path }) });
      if (!r.ok) throw new Error("insert " + r.status);
      document.body.classList.add("sent");
    } catch (e2) {
      err.textContent = "משהו לא עבד. נסו שוב בעוד רגע."; send.disabled = false; send.textContent = "שליחת הברכה";
    }
  });
})();
</script>
</body>
</html>
