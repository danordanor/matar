<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מטר</title>
<meta name="description" content="תראו אותו גדל.">
<meta property="og:title" content="מטר">
<meta property="og:description" content="תראו אותו גדל.">
<meta property="og:image" content="poster.jpg">
<meta name="theme-color" content="#ffffff">
<style>
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(fonts/plex-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(fonts/plex-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-2199, U+25A0, U+FEFF; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(fonts/plex-hebrew-500.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(fonts/plex-latin-500.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-2199, U+25A0, U+FEFF; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 600; src: url(fonts/plex-hebrew-600.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 600; src: url(fonts/plex-latin-600.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-2199, U+25A0, U+FEFF; font-display: swap; }

  :root { --ink: #111; --soft: #8c8c8c; --line: #e3e3e3; --ease: cubic-bezier(.22, 1, .36, 1); --bar: 72px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #fff; }
  button, a { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-decoration: none; }

  /* top bar */
  header { position: fixed; top: 0; inset-inline: 0; height: var(--bar); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--line); background: #fff; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 22px; letter-spacing: -.02em; }
  .brand svg { width: 28px; height: 28px; }
  .tools { display: flex; gap: 6px; }
  .b { height: 40px; min-width: 40px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #d6d6d6; font-size: 14px; letter-spacing: -.01em; transition: border-color .25s, background .25s; white-space: nowrap; }
  .b:hover { border-color: var(--ink); }
  .b.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .b.icon { padding: 0; width: 40px; }
  .b svg { width: 16px; height: 16px; }

  /* stage */
  #book { position: fixed; top: var(--bar); bottom: 44px; inset-inline: 0; opacity: 0; transition: opacity 1.4s var(--ease); }
  .ready #book { opacity: 1; }
  #book canvas { display: block; touch-action: none; }

  .arrow { position: fixed; top: calc(50% + 14px); transform: translateY(-50%); width: 40px; height: 40px; border: 1px solid #d6d6d6; display: grid; place-items: center; background: #fff; transition: opacity .5s var(--ease), border-color .25s; z-index: 4; }
  .arrow:hover { border-color: var(--ink); }
  .arrow svg { width: 16px; height: 16px; }
  .arrow.l { left: 24px; } .arrow.r { right: 24px; }
  .arrow[disabled] { opacity: 0; pointer-events: none; }

  .under { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%); z-index: 4; transition: opacity .5s var(--ease); }
  [data-state="open"] .under .open-ed, [data-state="pages"] .under .open-ed, [data-state="front"] .under .close-ed, [data-state="back"] .under .close-ed { display: none; }

  /* status bar */
  footer { position: fixed; bottom: 0; inset-inline: 0; height: 44px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 20px; font-size: 13px; color: var(--soft); background: #fff; z-index: 5; }
  footer .hint { display: flex; align-items: center; gap: 10px; }
  footer .hint::before { content: ""; width: 6px; height: 6px; background: var(--ink); }
  footer .end { text-align: end; }
  .prog { display: flex; align-items: center; gap: 12px; direction: ltr; color: var(--ink); font-variant-numeric: tabular-nums; }
  .prog .track { position: relative; width: min(260px, 32vw); height: 22px; cursor: pointer; }
  .prog .track::before { content: ""; position: absolute; inset-inline: 0; top: 50%; height: 1px; background: #cfcfcf; }
  .prog .fill { position: absolute; left: 0; top: 50%; height: 1px; margin-top: 0; background: var(--ink); width: 0; }
  .prog .fill.thick { height: 2px; margin-top: -.5px; }

  video#film { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  video#film:fullscreen { width: 100%; height: 100%; opacity: 1; background: #000; }

  @media (max-width: 720px) {
    :root { --bar: 60px; }
    header { padding: 0 14px; } .tools .wide { display: none; }
    footer { grid-template-columns: 1fr; justify-items: center; } footer .hint, footer .end { display: none; }
    .arrow.l { left: 10px; } .arrow.r { right: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; } }
</style>
</head>
<body data-state="front">
<header>
  <div class="brand">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M14 3 24 8v12l-10 5L4 20V8z"/><path d="M4 8l10 5 10-5M14 13v12"/></svg>
    <span>מטר</span>
  </div>
  <nav class="tools">
    <button class="b icon" id="mute" aria-label="sound"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6h3l4-3v10l-4-3H2z"/><path id="wave" d="M11.5 5.5a3.5 3.5 0 0 1 0 5"/></svg></button>
    <button class="b icon" id="full" aria-label="מסך מלא"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
    <button class="b dark" id="watch"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11L13 8z"/></svg>לצפייה בסרטון</button>
  </nav>
</header>

<div id="book" aria-label="מטר"></div>

<button class="arrow l" id="left" aria-label="left"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 3 5 8l5 5"/></svg></button>
<button class="arrow r" id="right" aria-label="right"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m6 3 5 5-5 5"/></svg></button>

<div class="under">
  <button class="b open-ed" id="openBook">פתחו את הספר <span aria-hidden="true">↗</span></button>
  <button class="b close-ed" id="closeBook">סגירת הספר</button>
</div>

<footer>
  <span class="hint" id="hint" data-front="לחצו על הכריכה כדי להתחיל" data-open="גררו את הדף · חיצים לדפדוף" data-back="לחצו על הספר כדי לצפות שוב">לחצו על הכריכה כדי להתחיל</span>
  <div class="prog">
    <span id="pa">כריכה</span>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <span id="pb">3</span>
  </div>
  <span class="end">מטר · בר מצווה</span>
</footer>

<video id="film" playsinline preload="auto" poster="poster.jpg"></video>

</body>
</html>
