<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מטר</title>
<meta name="description" content="תראו אותו גדל.">
<meta property="og:title" content="מטר">
<meta property="og:description" content="תראו אותו גדל.">
<meta property="og:image" content="poster.jpg">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @font-face { font-family: "Hand"; font-weight: 400; src: url(fonts/hand-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Hand"; font-weight: 400; src: url(fonts/hand-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(fonts/plex-hebrew-400.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 400; src: url(fonts/plex-latin-400.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-2199, U+25A0, U+FEFF; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(fonts/plex-hebrew-500.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 500; src: url(fonts/plex-latin-500.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-2199, U+25A0, U+FEFF; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 600; src: url(fonts/plex-hebrew-600.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Swiss"; font-weight: 600; src: url(fonts/plex-latin-600.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-2199, U+25A0, U+FEFF; font-display: swap; }

  :root { --ink: #111; --soft: #8c8c8c; --line: #e3e3e3; --ease: cubic-bezier(.22, 1, .36, 1); --bar: 72px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #fff; }
  button, a { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-decoration: none; }

  /* top bar */
  header { position: fixed; top: 0; inset-inline: 0; height: var(--bar); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--line); background: #fff; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 22px; letter-spacing: -.02em; }
  .brand svg { width: 28px; height: 28px; }
  .tools { display: flex; gap: 6px; }
  .b { height: 40px; min-width: 40px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #d6d6d6; font-size: 14px; letter-spacing: -.01em; transition: border-color .25s, background .25s; white-space: nowrap; }
  .b:hover { border-color: var(--ink); }
  .b.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .b.icon { padding: 0; width: 40px; }
  .b svg { width: 16px; height: 16px; }
  #watch .ic-pause, .playing #watch .ic-play { display: none; }
  .playing #watch .ic-pause { display: block; }

  /* stage */
  #book { position: fixed; top: var(--bar); bottom: 48px; inset-inline: 0; opacity: 0; transition: opacity 1.4s var(--ease); }
  .ready #book { opacity: 1; }
  #book canvas { display: block; touch-action: none; }

  .arrow { position: fixed; top: calc(50% + 14px); transform: translateY(-50%); width: 40px; height: 40px; border: 1px solid #d6d6d6; display: grid; place-items: center; background: #fff; transition: opacity .5s var(--ease), border-color .25s; z-index: 4; }
  .arrow:hover { border-color: var(--ink); }
  .arrow svg { width: 16px; height: 16px; }
  .arrow.l { left: 24px; } .arrow.r { right: 24px; }
  .arrow[disabled] { opacity: 0; pointer-events: none; }

  .b.small { height: 28px; padding: 0 10px; font-size: 12px; }
  [data-state="open"] .open-ed, [data-state="pages"] .open-ed, [data-state="front"] .close-ed, [data-state="back"] .close-ed { display: none; }

  /* status bar */
  footer { position: fixed; bottom: 0; inset-inline: 0; height: 48px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 20px; font-size: 13px; color: var(--soft); background: #fff; z-index: 5; }
  footer .ctl { justify-self: end; }
  footer .prog { justify-self: start; }
  .strip { display: flex; gap: 6px; justify-self: center; overflow-x: auto; max-width: 100%; padding: 4px 2px; scrollbar-width: none; direction: rtl; touch-action: pan-x; }
  .strip::-webkit-scrollbar { display: none; }
  .strip .pg { display: flex; gap: 1px; padding: 0; border: 1px solid #e2e2e2; outline: 2px solid transparent; outline-offset: 1px; background: #fff; cursor: pointer; flex: none; opacity: .4; transition: opacity .2s, outline-color .2s; }
  .strip .pg canvas { display: block; }
  .strip .pg:hover { opacity: .85; }
  .strip .pg.on { opacity: 1; border-color: var(--ink); outline-color: var(--ink); }
  .prog { display: flex; align-items: center; gap: 12px; direction: rtl; color: var(--ink); font-variant-numeric: tabular-nums; }
  .prog .track { position: relative; width: min(260px, 32vw); height: 22px; cursor: pointer; }
  .prog .track::before { content: ""; position: absolute; inset-inline: 0; top: 50%; height: 1px; background: #cfcfcf; }
  .prog .fill { position: absolute; left: 0; top: 50%; height: 1px; margin-top: 0; background: var(--ink); width: 0; }
  .prog .fill.thick { height: 2px; margin-top: -.5px; }

  /* full screen: only the book, a small way out in the corner */
  .full header, .full footer { display: none !important; }
  .full, .full body { background: #000; }
  .full #book { top: 0; bottom: 0; }
  .full .arrow { top: 50%; background: transparent; border-color: rgba(255,255,255,.18); color: rgba(255,255,255,.5); opacity: .5; }
  .full .arrow:hover { opacity: 1; border-color: rgba(255,255,255,.5); }
  /* TV mode: only the book, playing by itself, with a QR to add a wish */
  .tvqr, .tvstart { display: none; }
  .tv header, .tv footer, .tv .arrow { display: none !important; }
  .tv #book { top: 0; bottom: 0; }
  .tv .tvqr { display: flex; position: fixed; bottom: 32px; inset-inline-start: 32px; z-index: 6; align-items: center; gap: 18px; background: #fff; padding: 16px 22px 16px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
  .tv .tvqr img { width: 120px; height: 120px; }
  .tv .tvqr b { display: block; font-size: 22px; font-weight: 600; }
  .tv .tvqr span { display: block; font-size: 15px; color: var(--soft); margin-top: 4px; }
  .tv .tvstart { display: grid; place-items: center; position: fixed; inset: 0; z-index: 9; background: rgba(255,255,255,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor: pointer; border: 0; }
  .tv .tvstart span { background: var(--ink); color: #fff; padding: 20px 34px; font-size: 22px; font-weight: 500; }
  video#film { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  video#film:fullscreen { width: 100%; height: 100%; opacity: 1; background: #000; }

  @media (max-width: 720px) {
    :root { --bar: 60px; }
    header { padding: 0 14px; } .tools .wide { display: none; }
    footer { grid-template-columns: auto 1fr auto; } footer .strip { display: none; }
    .arrow.l { left: 10px; } .arrow.r { right: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; } }
</style>
</head>
<body data-state="front">
<header>
  <div class="brand">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M6 7.5h13v16H6z"/><path d="M6 7.5 9 4.5h13v16l-3 3"/><path d="M19 7.5l3-3"/><path d="M8.2 5.3h13M7.4 6.1h13" stroke-width="1" opacity=".55"/></svg>
    <span>מטר</span>
  </div>
  <nav class="tools">
    <button class="b icon" id="full" aria-label="מסך מלא"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
    <a class="b" href="add/">הוסיפו ברכה</a>
    <button class="b dark" id="watch"><svg class="ic-play" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11L13 8z"/></svg><svg class="ic-pause" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3" height="11"/><rect x="9.5" y="2.5" width="3" height="11"/></svg><span id="watchTxt">לצפייה בסרטון</span></button>
  </nav>
</header>

<div id="book" aria-label="מטר"></div>

<button class="arrow l" id="left" aria-label="left"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 3 5 8l5 5"/></svg></button>
<button class="arrow r" id="right" aria-label="right"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m6 3 5 5-5 5"/></svg></button>


<footer>
  <div class="prog">
    <span id="pa">כריכה</span>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <span id="pb">3</span>
  </div>
  <div class="strip" id="strip" aria-label="pages"></div>
  <div class="ctl">
    <button class="b small open-ed" id="openBook">פתחו את הספר</button>
    <button class="b small close-ed" id="closeBook">סגירת הספר</button>
  </div>
</footer>

<div class="tvqr" aria-hidden="true">
  <img src="qr.svg" alt="">
  <div><b>רוצים להוסיף ברכה?</b><span>סרקו, כתבו ברכה והוסיפו תמונה</span></div>
</div>
<button class="tvstart" id="tvStart"><span>הפעלת הספר</span></button>

<video id="film" playsinline preload="auto" poster="poster.jpg"></video>
